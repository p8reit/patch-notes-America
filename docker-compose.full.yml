services:
  kokoro:
    image: hangrylabs/kokorotts:v0.2
    container_name: patch-notes-kokoro
    ports:
      - "7860:7860"
    restart: unless-stopped

  app:
    build: .
    container_name: patch-notes-app
    depends_on:
      - kokoro
    environment:
      KOKORO_URL: http://kokoro:7860
      DEFAULT_VOICE: am_michael
      DEFAULT_TEMPO: "1.00"
      MAX_CHARS_PER_CHUNK: "700"
      EPISODES_DIR: /app/episodes
      OUTPUT_DIR: /app/output
      CONFIG_DIR: /app/config
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_RESPONSES_URL: ${OPENAI_RESPONSES_URL:-https://api.openai.com/v1/responses}
    ports:
      - "8080:8080"
    volumes:
      - ./episodes:/app/episodes
      - ./output:/app/output
      - ./config:/app/config
    restart: unless-stopped
