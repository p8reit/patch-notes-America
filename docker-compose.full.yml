services:
  imagegen:
    build:
      context: .
      dockerfile: imagegen/Dockerfile
    profiles: ["local-image"]
    environment:
      IMAGEGEN_DEVICE: cuda
      IMAGEGEN_MODEL: ${LOCAL_IMAGE_MODEL:-stabilityai/sdxl-turbo}
      IMAGEGEN_STEPS: ${LOCAL_IMAGE_STEPS:-2}
      IMAGEGEN_CPU_OFFLOAD: ${LOCAL_IMAGE_CPU_OFFLOAD:-true}
      NVIDIA_DRIVER_CAPABILITIES: compute
    volumes:
      - imagegen-models:/models
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import json,urllib.request; assert json.load(urllib.request.urlopen('http://localhost:8000/health'))['ok']\""]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 120s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.11.10
    profiles: ["local-ai"]
    ports:
      - "${OLLAMA_BIND_ADDRESS:-127.0.0.1}:${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

  chatterbox:
    build:
      context: .
      dockerfile: chatterbox/Dockerfile
    environment:
      # CUDA is intentionally available only through docker-compose.gpu.yml.
      CHATTERBOX_DEVICE: cpu
      CHATTERBOX_EXAGGERATION: ${CHATTERBOX_EXAGGERATION:-0.5}
      CHATTERBOX_CFG_WEIGHT: ${CHATTERBOX_CFG_WEIGHT:-0.5}
    ports:
      - "${CHATTERBOX_BIND_ADDRESS:-127.0.0.1}:${CHATTERBOX_PORT:-8000}:8000"
    volumes:
      - ./data/voices:/voices:ro
      - chatterbox-models:/models
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import json, urllib.request; data = json.load(urllib.request.urlopen('http://localhost:8000/health')); assert data['ok'], data"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  app:
    build: .
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8080"]
    depends_on:
      chatterbox:
        condition: service_healthy
    environment:
      CHATTERBOX_URL: http://chatterbox:8000
      CHATTERBOX_TTS_PATH: ${CHATTERBOX_TTS_PATH:-/v1/audio/speech}
      CHATTERBOX_HEALTH_PATH: ${CHATTERBOX_HEALTH_PATH:-/health}
      CHATTERBOX_PUBLIC_URL: ${CHATTERBOX_PUBLIC_URL:-}
      CHATTERBOX_PUBLIC_PORT: ${CHATTERBOX_PORT:-8000}
      CHATTERBOX_TIMEOUT_SECONDS: ${CHATTERBOX_TIMEOUT_SECONDS:-600}
      JOB_WORKERS: ${JOB_WORKERS:-1}
      TTS_MAX_ATTEMPTS: ${TTS_MAX_ATTEMPTS:-5}
      TTS_RETRY_DELAY_SECONDS: ${TTS_RETRY_DELAY_SECONDS:-15}
      DEFAULT_VOICE: ${DEFAULT_VOICE:-default}
      DEFAULT_TEMPO: ${DEFAULT_TEMPO:-1.00}
      MAX_CHARS_PER_CHUNK: ${MAX_CHARS_PER_CHUNK:-280}
      SILENCE_THRESHOLD_DB: ${SILENCE_THRESHOLD_DB:--45}
      MAX_LEADING_SILENCE_MS: ${MAX_LEADING_SILENCE_MS:-250}
      MAX_TRAILING_SILENCE_MS: ${MAX_TRAILING_SILENCE_MS:-350}
      SPEECH_SAFETY_BUFFER_MS: ${SPEECH_SAFETY_BUFFER_MS:-40}
      SAME_SPEAKER_PAUSE_MS: ${SAME_SPEAKER_PAUSE_MS:-225}
      NORMAL_TRANSITION_PAUSE_MS: ${NORMAL_TRANSITION_PAUSE_MS:-400}
      SPEAKER_CHANGE_PAUSE_MS: ${SPEAKER_CHANGE_PAUSE_MS:-500}
      DRAMATIC_PAUSE_MS: ${DRAMATIC_PAUSE_MS:-1000}
      EPISODES_DIR: /app/episodes
      OUTPUT_DIR: /app/output
      CONFIG_DIR: /app/config
      DATA_DIR: /app/data
      MAX_VOICE_UPLOAD_MB: ${MAX_VOICE_UPLOAD_MB:-50}
      MAX_INTRO_TRACK_MB: ${MAX_INTRO_TRACK_MB:-50}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_RESPONSES_URL: ${OPENAI_RESPONSES_URL:-https://api.openai.com/v1/responses}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-2}
      OPENAI_IMAGES_URL: ${OPENAI_IMAGES_URL:-https://api.openai.com/v1/images/generations}
      CLIP_IMAGE_PROVIDER: ${CLIP_IMAGE_PROVIDER:-openai}
      LOCAL_IMAGE_MODEL: ${LOCAL_IMAGE_MODEL:-stabilityai/sdxl-turbo}
      LOCAL_IMAGES_URL: ${LOCAL_IMAGES_URL:-http://imagegen:8000/v1/images/generations}
      CONVERSATION_PROVIDER: ${CONVERSATION_PROVIDER:-openai}
      LOCAL_AI_URL: ${LOCAL_AI_URL:-http://ollama:11434/api/chat}
      LOCAL_AI_MODEL: ${LOCAL_AI_MODEL:-llama3.1:8b}
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:${APP_PORT:-8081}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8080/api/health | grep -q '\"chatterbox\":{\"ok\":true'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - ./episodes:/app/episodes
      - ./output:/app/output
      - ./config:/app/config
      - ./data:/app/data
    restart: unless-stopped

volumes:
  ollama-data:
  chatterbox-models:
  imagegen-models:
