services:
  app:
    build: .
    container_name: patch-notes-app
    environment:
      KOKORO_URL: ${KOKORO_URL:-http://host.docker.internal:7860}
      DEFAULT_VOICE: ${DEFAULT_VOICE:-am_michael}
      DEFAULT_TEMPO: ${DEFAULT_TEMPO:-1.00}
      MAX_CHARS_PER_CHUNK: ${MAX_CHARS_PER_CHUNK:-700}
      EPISODES_DIR: /app/episodes
      OUTPUT_DIR: /app/output
      CONFIG_DIR: /app/config
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.6-luna}
      OPENAI_RESPONSES_URL: ${OPENAI_RESPONSES_URL:-https://api.openai.com/v1/responses}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    volumes:
      - ./episodes:/app/episodes
      - ./output:/app/output
      - ./config:/app/config
    restart: unless-stopped
